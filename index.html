<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<meta name="description" content="This is a parent teacher forum">
		<title>Home</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<form>
			<section>
				<h1>Parent Teacher Conference</h1>
				<fieldset>
					<legend>Student Information</legend>
					<ul>
						<li>
							<label for="student-name">Full Name: </label>
							<input id="student-name" type="text" name="student-name" placeholder="E.g., David Goodman " required >
						</li>
						<li>
							<label for="student-grade">Grade: </label>
							<select id="student-grade">
								<option value="none" selected disabled >select an option</option>
								<option value="Excellent">Excellent</option>
								<option value="Very Good">Very Good</option>
								<option value="Good">Good</option>
								<option value="pass">Pass</option>
								<option value="Fair">Fair</option>
								<option value="Poor">Poor</option>
							</select>
						</li>
					</ul>
				</fieldset>
				<fieldset>
					<legend>Parent contact method</legend>
					<input type="radio" id="email" name="recommend" checked value="email">
					<label for="email">Email</label>
					<input type="radio" id="phone" name="recommend" value="phone">
					<label for="phone">Phone</label>
				</fieldset>
				<fieldset>
					<legend>Parent/Guardian Information</legend>
					<ul>
						<li>
							<label for="parent-name">Full Name: </label>
							<input id="parent-name" type="text" name="parent-name" placeholder="E.g., Isaiah Goodman " required >
						</li>
						<li>
							<label for="parent-email">Email: </label>
							<input id="parent-email" type="email" name="parent-email" placeholder="E.g., IsaiahGoodman@gmail.com " required>
						</li>
						<li>
							<label for="parent-phone">Phone Number: </label>
							<input id="parent-phone" type="text" name="parent-phone" placeholder="E.g., 09133221108" required>
						</li>
					</ul>
				</fieldset>
				<button type="submit">Submit Form </button>
			</section>
		</form>
	</body>
</html>
