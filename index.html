<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width,initial-scale=1.0">
		<meta name="description" content="Happy Birthday Card">
		<title>Happy Birthday Card </title> 
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<section id="card">
			<h1>Happy Birthday!</h1>
			<p>Wishing you all the happiness and joy every day!</p>
			<a href="#send"><button>send card</button></a>
			<a href="#share"><button>share on social media</button></a>
		</section>
		<section id="send" class="message">
			<h2>Sending Card...</h2>
			<p>Card sent successfully, enjoy!</p>
		</section>
		<section id="share" class="message">
			<h2>Sharing Card...</h2>
			<p>Card shared successfully, enjoy!</p>
		</section>
	</body>
</html>
