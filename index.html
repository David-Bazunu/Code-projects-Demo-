<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <section>
        <h1>Job Application Form</h1>
        <form>
            <pre>
<label for="username"><b>Full Name: </b></label>
<input id="username" required type="text" placeholder="Enter your name"name="username">
<label for="email"><b>Email: </b></label>
<input id="email"  required type="email" placeholder="Enter your email" name="email">
<label for="position"><b>Position: </b></label>
<select id="position" required>
<option value="none" disabled selected>select an option</option>
<option value="developer">Developer</option>
    <option value="designer">Designer</option>
    <option value="manager">Manager</option>
</select>
            </pre>
            <fieldset>
                <legend>Availability: </legend>
                <input type="radio" checked id="fulltime" name="recommend">
                <label for="fulltime">Full-Time</label>
                <input type="radio" name="recommend" required id="partime">
                <label for="partime">Part-Time</label>
            </fieldset>
            <pre>
<label for="comments"><b>Why do you want this job?</b></label>
<textarea col="50" row="50" required placeholder="Write your motivation"></textarea>
            </pre>
            <button type="submit">Submit Application</button>
        </form>
    </section>
</body>
</html>
