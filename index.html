<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale1.0">
		<meta name="description" content="This is a reg form">
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<form>
			<section>
				<h1>Registration Form</h1>
				<p>Please fill out this form with the required information</p>
				<pre>
<label for="firstname">Enter Your First Name:</label>
<input type="text" name="firstname" id="firstname" required >
<label for="lastname">Enter Your Last Name:</label>
<input type="text" name="lastname" id="lastname" required >
<label for="email">Enter Your Email:</label>
<input type="email" name="email" id="email" required >
<label for="password">Create a New Password:</label>
<input type="password" name="password" id="password" required >
				</pre>
				<hr>
				<p>Account type (required)</p>
				<div>
					<input type="radio" value="personal" checked id="personal" name="Account">
					<label for="personal">personal</label>
				</div>
				<div>
					<input type="radio" value="business" id="business" name="Account">
					<label for="business">business</label>
				</div>
				<hr>
				<pre>
<label for="user-image">Upload a profile picture:</label>
<input type="file" id="user-image" name="user-image" required>
<label for="age">Input you Age(yrs):</label>
<input type="number" name="number" id="number" required min-length="0" max-length="100">
<label for="about-us">How did you hear about us?</label>
<select id="about-us" required >
	<option value="none" disabled selected>(select one)</option>
	<option value="free code camp news">FreeCodeCamp News</option>
	<option value="free code camp youtube channel">FreeCodeCamp YouTube Channel</option>
	<option value="free code camp forum">FreeCodeCamp Forum</option>
	<option value="other">Other</option>
</select>
<label for="bio">Provide a bio:</label>
<textarea required placeholder="I like coding on the beach..."cols="50"rows="10" id="bio"></textarea>
				</pre>
				<p><a href="terms and conditions">Read our terms and conditions</a></p>
				<nav>
					<input type="checkbox" required checked value="i accept"id="TP" name="TP">
					<label for="TP">I Accept Terms & Conditions </label>
				</nav>
				<button type="submit">submit</button>
			</section>
		</form>
	</body>
</html>
