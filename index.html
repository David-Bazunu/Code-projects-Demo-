<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="This is a cards app">
	<link rel="stylesheet" href="styles.css">
	<title>House of cards</title>
</head>
<body>
	<section>
		<div>
			<span class="top-left">A</span>
			<span class="top-left">♠</span>
			<span class="center">♠</span>
			<span class="bottom-right">♠</span>
			<span class="bottom-right">A</span>
		</div>
		<div id="second-card">
			<span class="top-left">2</span>
			<span class="top-left">♣</span>
			<span class="center">♣</span>
			<nav>
				<span class="center">♣</span>
			</nav>
			<span class="bottom-right">♣</span>
			<span class="bottom-right">2</span>
		</div>
		<div id="third-card">
			<span class="top-left">3</span>
			<span class="top-left">♥</span>
			<span class="center">♥</span>
			<span class="center">♥</span>
			<nav>
				<span class="center">♥</span>
			</nav>
			<span class="bottom-right">♥</span>
			<span class="bottom-right">3</span>
		</div>
	</section>
	<section>
		<div id="fourth-card">
			<span class="top-left">4</span>
			<span class="top-left">♣</span>
			<nav>
				<span class="center">♣</span>
				<span class="center">♣</span>
			</nav>
			<nav>
				<span class="center">♣</span>
				<span class="center">♣</span>
			</nav>
			<span class="bottom-right">♣</span>
			<span class="bottom-right">4</span>
		</div>
		<div id="fifth-card">
			<span class="top-left">5</span>
			<span class="top-left">♦</span>
			<nav>
				<span class="center">♦</span>
				<span class="center">♦</span>
			</nav>
			<span class="center">♦</span>
			<nav>
				<span class="center">♦</span>
				<span class="center">♦</span>
			</nav>
			<span class="bottom-right">♦</span>
			<span class="bottom-right">5</span>
		</div>
	</section>
</body>
</html>
