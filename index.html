<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="This is a web-cards">
		<title>House of cards</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<section>
			<div class="card">
				<div class="card-corner top-left">
					<span class="value">A</span>
					<span class="suit">♠</span>
				</div>
				<div class="card-center">
					<span class="pip">♠</span>
				</div>
				<div class="card-corner bottom-right">
					<span class="value">A</span>
					<span class="suit">♠</span>
				</div>
			</div>
			<div class="card">
				<div class="card-corner top-left">
					<span class="value">2</span>
					<span class="suit">♣</span>
				</div>
				<div class="card-center column-2">
					<span class="pip">♣</span>
					<span class="pip upside-down">♣</span>
				</div>
				<div class="card-corner bottom-right">
					<span class="value">2</span>
					<span class="suit">♣</span>
				</div>
			</div>
			<div class="card red">
				<div class="card-corner top-left">
					<span class="value">3</span>
					<span class="suit">♥</span>
				</div>
				<div class="card-center column-3">
					<span class="pip">♥</span>
					<span class="pip">♥</span>
					<span class="pip upside-down">♥</span>
				</div>
				<div class="card-corner bottom-right">
					<span class="value">3</span>
					<span class="suit">♥</span>
				</div>
			</div>
		</section>
		<section>
			<div class="card">
				<div class="card-corner top-left">
					<span class="value">4</span>
					<span class="suit">♣</span>
				</div>
				<div class="card-center grid-4">
					<span class="pip">♣</span>
					<span class="pip">♣</span>
					<span class="pip upside-down">♣</span>
					<span class="pip upside-down">♣</span>
				</div>
				<div class="card-corner bottom-right">
					<span class="value">4</span>
					<span class="suit">♣</span>
				</div>
			</div>
			<div class="card red">
				<div class="card-corner top-left">
					<span class="value">5</span>
					<span class="suit">♦</span>
				</div>
				<div class="card-center grid-5">
					<span class="pip">♦</span>
					<span class="pip">♦</span>
					<span class="pip center-pip">♦</span>
					<span class="pip upside-down">♦</span>
					<span class="pip upside-down">♦</span>
				</div>
				<div class="card-corner bottom-right">
					<span class="value">5</span>
					<span class="suit">♦</span>
				</div>
			</div>
		</section>
	</body>
</html>
