<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="style.css">
    </head>
    <body id="login-body">
       <fieldset id="round">
        <legend id="red">welcome</legend>
        <form action="/action">
            <ul>
                <li><label for="username" id="red">User Name : </label>
                <input type="text" id="username" name="username" placeholder="Enter your username" id="red"></li>
                <li><label for="password" id="red">Password : </label>
                <input type="password" id="password" name="password" placeholder="Enter your password" id="red"></li>
            </ul>
            <button type="submit" id="submit">ok</button>
        </form>
       </fieldset> 
    </body>
</html>
